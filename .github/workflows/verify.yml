name: Verify CRM
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - run: npm run build
      - run: node --test tests/*.test.mjs
      - name: Check Pages Functions bundle
        run: npx wrangler pages functions build functions --outdir=.functions-check
      - name: Test Outlook connector with mock responses
        shell: pwsh
        run: ./tests/outlook.test.ps1
